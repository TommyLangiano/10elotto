<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="10eLotto">
<title>10eLotto ogni 5 minuti</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --verde: #0b5d3b;
    --sfondo: #fffaf0;
    --testo: #1a1a1a;
    --oro: #ffc400;
    --doppio: #ff7a00;
    --bordo: #e6e1d6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--sfondo); color: var(--testo); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 20px; line-height: 1.3;
    max-width: 640px; margin: 0 auto;
    padding: 12px 16px calc(130px + env(safe-area-inset-bottom));
  }

  .testa { text-align: center; margin-bottom: 10px; }
  .numero-estr { font-size: 34px; font-weight: 900; color: var(--verde); margin: 2px 0; }
  .quando { font-size: 22px; font-weight: 700; }
  .etichetta-ultima {
    display: inline-block; margin-top: 6px; padding: 4px 14px; border-radius: 999px;
    background: #c62828; color: #fff; font-size: 18px; font-weight: 800;
  }
  .etichetta-ultima[hidden] { display: none; }

  .palline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .pallina {
    aspect-ratio: 1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(26px, 8.5vw, 40px); font-weight: 900;
    background: var(--verde); color: #fff;
  }
  .pallina.oro { background: var(--oro); color: #222; box-shadow: 0 0 0 4px #b38600 inset; }
  .pallina.doppio { background: var(--doppio); color: #fff; box-shadow: 0 0 0 4px #b35500 inset; }

  .legenda { display: flex; gap: 10px; margin: 14px 0; }
  .legenda div {
    flex: 1; border-radius: 14px; padding: 8px; text-align: center;
    font-size: 20px; font-weight: 800;
  }
  .legenda b { display: block; font-size: 34px; }
  .leg-oro { background: var(--oro); color: #222; }
  .leg-doppio { background: var(--doppio); color: #fff; }

  .extra { border: 3px solid var(--bordo); border-radius: 16px; padding: 10px; background: #fff; }
  .extra h2 { font-size: 20px; margin: 0 0 8px; text-align: center; color: #555; }
  .extra .palline { gap: 6px; }
  .extra .pallina {
    background: #fff; color: #333; border: 3px solid #9e9e9e;
    font-size: clamp(18px, 5.5vw, 26px);
  }

  .messaggio { text-align: center; font-size: 24px; padding: 40px 10px; }

  .frecce {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: #fff; border-top: 3px solid var(--bordo);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .frecce .dentro { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
  .btn {
    flex: 1; min-height: 88px; border: 0; border-radius: 18px; cursor: pointer;
    font: inherit; font-size: 26px; font-weight: 900; color: #fff; background: var(--verde);
    box-shadow: 0 4px 0 rgba(0,0,0,.25); padding: 6px;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .btn:disabled { opacity: .3; }
  .btn .freccia { display: block; font-size: 38px; line-height: 1; }
  .btn.ultima { flex: 0.8; background: #c62828; font-size: 20px; }
  .btn.ultima[hidden] { display: none; }
</style>
</head>
<body>

<div class="testa">
  <div class="numero-estr" id="titolo">10eLotto ogni 5 minuti</div>
  <div class="quando" id="quando">Caricamento…</div>
  <span class="etichetta-ultima" id="etichetta-ultima" hidden>🔴 ULTIMA USCITA</span>
</div>

<main id="contenuto">
  <p class="messaggio">Sto caricando le estrazioni…</p>
</main>

<nav class="frecce">
  <div class="dentro">
    <button class="btn" id="prima" disabled><span class="freccia">◀</span>PRIMA</button>
    <button class="btn ultima" id="vai-ultima" hidden><span class="freccia">⏭</span>ULTIMA</button>
    <button class="btn" id="dopo" disabled><span class="freccia">▶</span>DOPO</button>
  </div>
</nav>

<script>
(function () {
  "use strict";

  var GIORNI = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
  var MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio",
    "agosto", "settembre", "ottobre", "novembre", "dicembre"];

  var indice = null;         // {giorni:[...], ultima:{data,n}}
  var cacheGiorni = {};      // "2026-10-11" -> [estrazioni]
  var posGiorno = -1;        // posizione in indice.giorni
  var posEstr = -1;          // posizione nella lista del giorno
  var seguiUltima = true;    // se sto guardando l'ultima, mi sposto da solo sulle nuove

  function $(id) { return document.getElementById(id); }

  function scarica(url) {
    return fetch(url + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function giorno(data) {
    if (cacheGiorni[data]) return Promise.resolve(cacheGiorni[data]);
    return scarica("dati/" + data + ".json").then(function (g) {
      cacheGiorni[data] = g.estrazioni;
      return g.estrazioni;
    });
  }

  function dataBella(data) {
    var p = data.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    var oggi = new Date(); oggi.setHours(0, 0, 0, 0);
    var diff = Math.round((oggi - d) / 86400000);
    var nome = diff === 0 ? "Oggi" : diff === 1 ? "Ieri" : GIORNI[d.getDay()];
    return nome + " " + d.getDate() + " " + MESI[d.getMonth()];
  }

  function eUltima() {
    return posGiorno === indice.giorni.length - 1 &&
      posEstr === cacheGiorni[indice.giorni[posGiorno]].length - 1;
  }

  function mostra() {
    var data = indice.giorni[posGiorno];
    var e = cacheGiorni[data][posEstr];
    $("titolo").textContent = "Estrazione n. " + e.n;
    $("quando").textContent = dataBella(data) + " · ore " + e.ora;
    var ultima = eUltima();
    $("etichetta-ultima").hidden = !ultima;
    $("vai-ultima").hidden = ultima;
    $("dopo").disabled = ultima;
    $("prima").disabled = posGiorno === 0 && posEstr === 0;

    var c = $("contenuto");
    c.innerHTML = "";
    var pal = document.createElement("div");
    pal.className = "palline";
    e.numeri.forEach(function (n) {
      var s = document.createElement("div");
      s.className = "pallina" + (n === e.oro ? " oro" : n === e.doppioOro ? " doppio" : "");
      s.textContent = n;
      pal.appendChild(s);
    });
    c.appendChild(pal);

    var leg = document.createElement("div");
    leg.className = "legenda";
    leg.innerHTML = '<div class="leg-oro">⭐ ORO<b></b></div><div class="leg-doppio">⭐⭐ DOPPIO ORO<b></b></div>';
    leg.querySelectorAll("b")[0].textContent = e.oro;
    leg.querySelectorAll("b")[1].textContent = e.doppioOro;
    c.appendChild(leg);

    if (e.extra && e.extra.length) {
      var ex = document.createElement("div");
      ex.className = "extra";
      ex.innerHTML = "<h2>Numeri Extra</h2>";
      var pe = document.createElement("div");
      pe.className = "palline";
      e.extra.forEach(function (n) {
        var s = document.createElement("div");
        s.className = "pallina";
        s.textContent = n;
        pe.appendChild(s);
      });
      ex.appendChild(pe);
      c.appendChild(ex);
    }
  }

  function errore(testo) {
    $("contenuto").innerHTML = "";
    var p = document.createElement("p");
    p.className = "messaggio";
    p.textContent = testo;
    $("contenuto").appendChild(p);
  }

  // Sposta di +1 / -1 estrazioni, passando al giorno prima/dopo se serve.
  function sposta(verso) {
    var lista = cacheGiorni[indice.giorni[posGiorno]];
    var nuovaEstr = posEstr + verso;
    if (nuovaEstr >= 0 && nuovaEstr < lista.length) {
      posEstr = nuovaEstr;
      seguiUltima = eUltima();
      mostra();
      return;
    }
    var nuovoGiorno = posGiorno + verso;
    if (nuovoGiorno < 0 || nuovoGiorno >= indice.giorni.length) return;
    $("prima").disabled = $("dopo").disabled = true;
    giorno(indice.giorni[nuovoGiorno]).then(function (l) {
      posGiorno = nuovoGiorno;
      posEstr = verso > 0 ? 0 : l.length - 1;
      seguiUltima = eUltima();
      mostra();
    }).catch(function () {
      mostra();
      errore("Non riesco a caricare. Controlla internet e riprova.");
    });
  }

  function vaiUltima() {
    posGiorno = indice.giorni.length - 1;
    posEstr = cacheGiorni[indice.giorni[posGiorno]].length - 1;
    seguiUltima = true;
    mostra();
  }

  // Ricarica l'indice e l'ultimo giorno; se ero sull'ultima estrazione, mostro quella nuova.
  function aggiorna() {
    return scarica("dati/indice.json").then(function (nuovo) {
      if (!nuovo.giorni || !nuovo.giorni.length) throw new Error("vuoto");
      var dataUltima = nuovo.giorni[nuovo.giorni.length - 1];
      delete cacheGiorni[dataUltima];
      return giorno(dataUltima).then(function () {
        var primaVolta = !indice;
        var giornoVisto = indice && indice.giorni[posGiorno];
        indice = nuovo;
        if (primaVolta || seguiUltima) {
          vaiUltima();
        } else {
          posGiorno = Math.max(0, indice.giorni.indexOf(giornoVisto));
          mostra();
        }
      });
    });
  }

  $("prima").onclick = function () { sposta(-1); };
  $("dopo").onclick = function () { sposta(1); };
  $("vai-ultima").onclick = vaiUltima;
  document.addEventListener("keydown", function (e) {
    if (!indice) return;
    if (e.key === "ArrowLeft") sposta(-1);
    if (e.key === "ArrowRight" && !eUltima()) sposta(1);
  });

  aggiorna().catch(function () {
    $("quando").textContent = "";
    errore("Non riesco a caricare le estrazioni. Controlla di essere collegata a internet e riapri l'app.");
  });
  setInterval(function () { aggiorna().catch(function () {}); }, 60000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) aggiorna().catch(function () {});
  });

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
