name: sonda-fonti
on:
  push:
    paths: ['.github/workflows/sonda.yml']
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Prova fonti 2
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          for u in https://10elottoogni5minuti.it/json/diecielotto5min-last https://10elottoogni5minuti.it/json/diecielotto5min-altre; do
            echo "=================== $u"
            curl -sS -m 25 -A "$UA" -H "Origin: https://example.github.io" -H "X-Requested-With: XMLHttpRequest" -D - -o /tmp/j "$u" | grep -iE '^(HTTP|content-type|access-control|cache-control)'
            head -c 2500 /tmp/j; echo
          done
          echo "=================== js"
          curl -sS -m 25 -A "$UA" https://10elottoogni5minuti.it/js/diecielotto5min.js | head -c 3000; echo
          echo "=================== 10elotto5minuti.com html struttura"
          curl -sS -m 25 -A "$UA" https://10elotto5minuti.com/estrazioni-di-oggi -o /tmp/c
          grep -n -m1 'n\. 45\|ore 0' /tmp/c | head -3
          L=$(grep -n 'Oggi, ore' /tmp/c | head -1 | cut -d: -f1); echo "riga $L"; sed -n "$((L-5)),$((L+60))p" /tmp/c | cut -c1-300
          echo "=================== link archivio 10elotto5minuti.com"
          grep -oE 'href="[^"]*"' /tmp/c | sort -u | grep -iE 'estraz|archiv|giorno|20[0-9]{2}' | head -40
          echo "=================== 10elottoogni5minuti.it link"
          curl -sS -m 25 -A "$UA" https://10elottoogni5minuti.it/ | grep -oE 'href="[^"]*"' | sort -u | head -60
